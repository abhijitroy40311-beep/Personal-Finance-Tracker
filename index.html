<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Finance Tracker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="app-container">
        <header class="app-header">
            <h1>Personal Expense Tracker</h1>
            <p>Track your income, expenses, and visual analytics</p>
        </header>

        <!-- Balance Summary Banner -->
        <section class="summary-grid">
            <div class="card balance-card">
                <h3>Total Balance</h3>
                <p id="total-balance" class="amount">$0.00</p>
            </div>
            <div class="card income-card">
                <h3>Total Income</h3>
                <p id="total-income" class="amount positive">+$0.00</p>
            </div>
            <div class="card expense-card">
                <h3>Total Expenses</h3>
                <p id="total-expenses" class="amount negative">-$0.00</p>
            </div>
        </section>

        <!-- Main Content Area -->
        <main class="main-layout">

            <!-- Form Section -->
            <section class="card form-section">
                <h2>Add Transaction</h2>
                <form id="transaction-form">

                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g., Grocery Shopping" required />
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">Amount ($)</label>
                            <input type="number" id="amount" step="0.01" placeholder="0.00" required />
                        </div>

                        <div class="form-group">
                            <label for="type">Type</label>
                            <select id="type">
                                <option value="expense">Expense</option>
                                <option value="income">Income</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="Food">Food & Dining</option>
                            <option value="Rent">Rent & Housing</option>
                            <option value="Utilities">Utilities & Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Salary">Salary & Earnings</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-primary">Add Transaction</button>
                </form>
            </section>

            <!-- Analytics & History Section -->
            <section class="right-column">

                <!-- Chart Section -->
                <div class="card chart-section">
                    <h2>Expense Breakdown</h2>
                    <div class="chart-wrapper">
                        <canvas id="expense-chart"></canvas>
                    </div>
                </div>

                <!-- History List -->
                <div class="card history-section">
                    <h2>Recent Transactions</h2>
                    <ul id="transaction-list" class="transaction-list">
                        <!-- Dynamic list items will be inserted here by JavaScript -->
                    </ul>
                </div>

            </section>

        </main>
    </div>

    <!-- Custom JS Logic -->
    <script src="app.js"></script>
</body>

</html>
